services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_NAME:-local_data}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-123456}
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
      - ./src/main/resources/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 20

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-models:/root/.ollama
    # 如需 GPU 加速(需 WSL2 后端 + NVIDIA Container Toolkit),取消下面注释:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  app:
    build: .
    container_name: base-end
    ports:
      - "9090:9090"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-local_data}
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-123456}
      OLLAMA_BASE_URL: http://ollama:11434
      RESEND_API_KEY: ${RESEND_API_KEY:-}
    volumes:
      - ./data:/app/data
    depends_on:
      mysql:
        condition: service_healthy
      ollama:
        condition: service_started

volumes:
  mysql-data:
  ollama-models: