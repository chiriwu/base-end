server.port=9090

spring.datasource.url=jdbc:mysql://localhost:3306/local_data?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.sql.init.mode=always

ollama.base-url=http://localhost:11434
ollama.model=qwen2.5:3b

# Spring AI Ollama config
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.model=qwen2.5:3b
spring.ai.ollama.chat.options.keep-alive=30m

# MCP Client config (stdio -> filesystem server via npx)
spring.ai.mcp.client.enabled=false
spring.ai.mcp.client.name=base-end-mcp
spring.ai.mcp.client.version=1.0
spring.ai.mcp.client.type=SYNC
spring.ai.mcp.client.request-timeout=20s
spring.ai.mcp.client.toolcallback.enabled=false
spring.ai.mcp.client.stdio.connections.filesystem.command=cmd
spring.ai.mcp.client.stdio.connections.filesystem.args[0]=/c
spring.ai.mcp.client.stdio.connections.filesystem.args[1]=npx
spring.ai.mcp.client.stdio.connections.filesystem.args[2]=-y
spring.ai.mcp.client.stdio.connections.filesystem.args[3]=@modelcontextprotocol/server-filesystem
spring.ai.mcp.client.stdio.connections.filesystem.args[4]=C:/Users/15321/Desktop

# Embedding 模型
spring.ai.ollama.embedding.model=bge-m3

# === 双 provider 配置(前端 provider 字段: ollama | api) ===
# ai.api.enabled=false 时只有本地 Ollama 可用,发 api 请求会自动回退 Ollama
ai.api.enabled=true
# OpenAI 兼容接口地址,注意不要带 /v1/chat/completions
# DeepSeek: https://api.deepseek.com
# 通义千问官方兼容模式: https://dashscope.aliyuncs.com/compatible-mode
# 千问私有 MaaS 网关: https://cn-beijing.maas.qianwenaiapi.com/compatible-mode
ai.api.base-url=https://cn-beijing.maas.qianwenaiapi.com/compatible-mode
# API Key 复用 application-local.properties 里的 dashscope.api-key,避免重复保存密钥
ai.api.api-key=${dashscope.api-key:}
ai.api.model=qwen3.8-flash
ai.api.temperature=0.7

# 本地敏感配置(API key 等),不提交 git
spring.config.import=optional:file:./application-local.properties

# 天气 API(亿约天气)
weather.api.base-url=http://api.yytianqi.com